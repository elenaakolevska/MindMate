{% load static %}
<style>
    /* Reset and Base Styles */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
    }

    /* Sidebar Styles */
    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: 280px;
        height: 100vh;
        background: white;
        border-right: 1px solid #e5e7eb;
        z-index: 1000;
        transition: width 0.3s ease, transform 0.3s ease;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .sidebar.collapsed {
        width: 80px;
    }

    /* Sidebar Header */
    .sidebar-header {
        padding: 20px 16px;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 73px;
        flex-shrink: 0;
    }

    .sidebar-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        overflow: hidden;
        flex: 1;
        text-decoration: none;
    }

    .sidebar-logo img {
        height: 32px;
        width: auto;
        flex-shrink: 0;
        transition: all 0.3s ease;
    }

    .sidebar.collapsed .sidebar-logo img {
        height: 28px;
    }

    .sidebar-logo-text {
        font-size: 18px;
        font-weight: 600;
        color: #1f2937;
        white-space: nowrap;
        transition: opacity 0.3s ease, width 0.3s ease;
    }

    .sidebar.collapsed .sidebar-logo-text {
        opacity: 0;
        width: 0;
    }



    /* Main Navigation */
    .sidebar-nav {
        flex: 0 0 auto;
        padding: 8px 0;
        border-bottom: 1px solid #e5e7eb;
    }

    /* Navigation Links */
    .sidebar-link {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        color: #6b7280;
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
        margin: 2px 8px;
        border-radius: 8px;
        transition: all 0.2s ease;
        white-space: nowrap;
        overflow: hidden;
    }

    .sidebar-link:hover {
        background: #f3f4f6;
        color: #374151;
    }

    .sidebar-link.active {
        background: #eff6ff;
        color: #2563eb;
        font-weight: 600;
    }

    .sidebar-link i {
        font-size: 18px;
        width: 20px;
        text-align: center;
        flex-shrink: 0;
    }

    .sidebar-link span {
        transition: opacity 0.3s ease;
    }

    .sidebar.collapsed .sidebar-link span {
        opacity: 0;
        width: 0;
    }

    .sidebar.collapsed .sidebar-link {
        justify-content: center;
        padding: 12px;
    }

    /* Study Agent Sessions Section */
    .sessions-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 12px 8px;
        overflow: hidden;
        min-height: 0;
        transition: opacity 0.3s ease;
    }

    .sidebar.collapsed .sessions-section {
        opacity: 0;
        height: 0;
        padding: 0;
    }

    .session-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px;
        margin-bottom: 8px;
    }

    .session-title {
        font-size: 11px;
        font-weight: 600;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .new-session-btn {
        background: #f3f4f6;
        border: none;
        color: #6b7280;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 4px;
        transition: all 0.2s ease;
    }

    .new-session-btn:hover {
        background: #e5e7eb;
    }

    .sessions-list {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
    }

    .session-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px;
        margin-bottom: 2px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        color: #6b7280;
        transition: all 0.2s ease;
    }

    .session-item:hover {
        background: #f9fafb;
    }

    .session-item.active {
        background: #eff6ff;
        color: #2563eb;
    }

    .session-item-content {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
    }

    .session-item-title {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .session-item-actions {
        opacity: 0;
        transition: opacity 0.2s ease;
    }

    .session-item:hover .session-item-actions {
        opacity: 1;
    }

    .session-action-btn {
        background: none;
        border: none;
        color: #9ca3af;
        cursor: pointer;
        padding: 2px;
        border-radius: 2px;
        font-size: 11px;
        transition: all 0.2s ease;
    }

    .session-action-btn:hover {
        background: #f3f4f6;
        color: #6b7280;
    }

    /* Logout Section */
    .sidebar-logout {
        padding: 8px;
        border-top: 1px solid #e5e7eb;
        flex-shrink: 0;
    }

    /* Main Content Area */
    .main-content,
    .main-content-area {
        margin-left: 280px;
        transition: margin-left 0.3s ease;
        min-height: 100vh;
        width: calc(100% - 280px);
    }

    .sidebar.collapsed ~ .main-content,
    .sidebar.collapsed ~ .main-content-area {
        margin-left: 80px;
        width: calc(100% - 80px);
    }

    /* Mobile Styles */
    @media (max-width: 768px) {
        .sidebar {
            transform: translateX(-100%);
            width: 280px;
            z-index: 2000;
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
            width: 280px;
        }

        .sidebar.collapsed.active {
            transform: translateX(0);
        }

        .main-content,
        .main-content-area {
            margin-left: 0;
            width: 100%;
        }

        .sidebar.collapsed ~ .main-content,
        .sidebar.collapsed ~ .main-content-area {
            margin-left: 0;
            width: 100%;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }
    }

    /* Scrollbar Styling */
    .sessions-list::-webkit-scrollbar {
        width: 4px;
    }

    .sessions-list::-webkit-scrollbar-track {
        background: transparent;
    }

    .sessions-list::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 2px;
    }

    .sessions-list::-webkit-scrollbar-thumb:hover {
        background: #9ca3af;
    }
</style>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <a href="{% url 'mindmate:home' %}" style="text-decoration: none;" class="sidebar-logo">
            <img src="{% static 'logo.png' %}" alt="MindMate">
            <span class="sidebar-logo-text">MindMate</span>
        </a>
    </div>
    <nav class="sidebar-nav">
        <a href="{% url 'mindmate:dashboard' %}" class="sidebar-link{% if request.resolver_match.url_name == 'dashboard' %} active{% endif %}">
            <i class="fas fa-th-large"></i>
            <span>Dashboard</span>
        </a>
        <a href="{% url 'mindmate:study_agent_chat' %}" class="sidebar-link{% if request.resolver_match.url_name == 'study_agent_chat' %} active{% endif %}">
            <i class="fas fa-robot"></i>
            <span>Study Agent</span>
        </a>
        <a href="{% url 'mindmate:calendar' %}" class="sidebar-link{% if request.resolver_match.url_name == 'calendar' %} active{% endif %}">
            <i class="fas fa-calendar-alt"></i>
            <span>Календар</span>
        </a>
        <a href="{% url 'mindmate:quiz_dashboard' %}" class="sidebar-link{% if request.resolver_match.url_name == 'quiz_dashboard' %} active{% endif %}">
            <i class="fas fa-graduation-cap"></i>
            <span>Мои Квизови</span>
        </a>
    </nav>
    <div class="sidebar-logout">
        <a href="{% url 'mindmate:logout' %}" class="sidebar-link" style="color: #ef4444;">
            <i class="fas fa-sign-out-alt"></i>
            <span>Одјави се</span>
        </a>
    </div>
</div>
<!-- Mobile sidebar overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileSidebar()"></div>

<script>
    // Sidebar State Management
    let sidebarState = {
        collapsed: localStorage.getItem('sidebarCollapsed') === 'true',
        mobileOpen: false,
        currentSessionId: null,
        csrfToken: null
    };

    // Initialize on DOM load
    document.addEventListener('DOMContentLoaded', function() {
        initializeSidebar();
    });

    function initializeSidebar() {
        sidebarState.csrfToken = getCSRFToken();

        // Apply saved sidebar state (desktop only)
        if (window.innerWidth > 768) {
            const sidebar = document.getElementById('sidebar');
            if (sidebarState.collapsed && sidebar) {
                sidebar.classList.add('collapsed');
            }
        }

        // Load sessions only if on study agent page
        if (window.location.pathname.includes('/study-agent/')) {
            loadChatSessions();
        }

        // Handle window resize
        window.addEventListener('resize', handleResize);
    }

    function handleResize() {
        const sidebar = document.getElementById('sidebar');
        if (window.innerWidth > 768) {
            // Desktop: restore collapsed state
            if (sidebarState.collapsed) {
                sidebar?.classList.add('collapsed');
            }
            // Close mobile menu
            closeMobileSidebar();
        } else {
            // Mobile: remove collapsed class
            sidebar?.classList.remove('collapsed');
        }
    }

    // Sidebar toggle functionality
    function toggleSidebar() {
        if (window.innerWidth <= 768) {
            // Mobile: toggle sidebar visibility
            toggleMobileSidebar();
        } else {
            // Desktop: toggle collapsed state
            const sidebar = document.getElementById('sidebar');
            sidebarState.collapsed = !sidebarState.collapsed;

            if (sidebarState.collapsed) {
                sidebar?.classList.add('collapsed');
            } else {
                sidebar?.classList.remove('collapsed');
            }

            localStorage.setItem('sidebarCollapsed', sidebarState.collapsed);
        }
    }

    function toggleMobileSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        sidebarState.mobileOpen = !sidebarState.mobileOpen;

        if (sidebarState.mobileOpen) {
            sidebar?.classList.add('active');
            overlay?.classList.add('active');
            document.body.style.overflow = 'hidden';
        } else {
            sidebar?.classList.remove('active');
            overlay?.classList.remove('active');
            document.body.style.overflow = '';
        }
    }

    function closeMobileSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        sidebarState.mobileOpen = false;
        sidebar?.classList.remove('active');
        overlay?.classList.remove('active');
        document.body.style.overflow = '';
    }

    // Get CSRF token
    function getCSRFToken() {
        if (sidebarState.csrfToken) return sidebarState.csrfToken;

        const meta = document.querySelector('meta[name="csrf-token"]');
        if (meta) return meta.getAttribute('content');

        const cookies = document.cookie.match(/csrftoken=([^;]+)/);
        return cookies ? cookies[1] : '';
    }

    // Session management functions
    function loadChatSessions() {
        if (!window.location.pathname.includes('/study-agent/')) return;

        fetch('/study-agent/history/', {
            headers: { 'X-CSRFToken': sidebarState.csrfToken }
        })
        .then(response => response.json())
        .then(data => {
            displaySessions(data.sessions || []);
            sidebarState.currentSessionId = data.current_session_id;
        })
        .catch(error => console.error('Session loading error:', error));
    }

    function displaySessions(sessions) {
        const sessionsList = document.getElementById('sessionsList');
        if (!sessionsList) return;

        if (sessions.length === 0) {
            sessionsList.innerHTML = `
                <div class="session-item active" data-session-id="new">
                    <div class="session-item-content">
                        <i class="fas fa-comments" style="font-size: 12px;"></i>
                        <div class="session-item-title">New Session</div>
                    </div>
                </div>
            `;
            return;
        }

        sessionsList.innerHTML = sessions.map((session, index) => `
            <div class="session-item ${index === 0 ? 'active' : ''}"
                 data-session-id="${session.id}"
                 onclick="switchToSession('${session.id}')"
                 title="${session.title}">
                <div class="session-item-content">
                    <i class="fas fa-comments" style="font-size: 12px;"></i>
                    <div class="session-item-title">${session.title || 'New Chat'}</div>
                </div>
                <div class="session-item-actions">
                    <button class="session-action-btn"
                            onclick="event.stopPropagation(); deleteSession('${session.id}')"
                            title="Delete">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        `).join('');
    }

    function createNewSession() {
        if (typeof clearCurrentChat === 'function') {
            clearCurrentChat();
        }

        sidebarState.currentSessionId = null;

        const sessionsList = document.getElementById('sessionsList');
        if (sessionsList) {
            sessionsList.querySelectorAll('.session-item').forEach(item => {
                item.classList.remove('active');
            });

            const newSession = document.createElement('div');
            newSession.className = 'session-item active';
            newSession.setAttribute('data-session-id', 'new');
            newSession.innerHTML = `
                <div class="session-item-content">
                    <i class="fas fa-comments" style="font-size: 12px;"></i>
                    <div class="session-item-title">New Session</div>
                </div>
            `;
            sessionsList.insertBefore(newSession, sessionsList.firstChild);
        }
    }

    function switchToSession(sessionId) {
        if (sessionId === sidebarState.currentSessionId) return;

        sidebarState.currentSessionId = sessionId;

        document.querySelectorAll('.session-item').forEach(item => {
            item.classList.remove('active');
        });
        document.querySelector(`[data-session-id="${sessionId}"]`)?.classList.add('active');

        if (typeof loadSessionMessages === 'function') {
            loadSessionMessages(sessionId);
        }
    }

    function deleteSession(sessionId) {
        if (!confirm('Delete this session?')) return;

        fetch(`/study-agent/sessions/${sessionId}/delete/`, {
            method: 'DELETE',
            headers: { 'X-CSRFToken': sidebarState.csrfToken }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                document.querySelector(`[data-session-id="${sessionId}"]`)?.remove();
                if (sessionId === sidebarState.currentSessionId) {
                    createNewSession();
                }
            }
        })
        .catch(error => console.error('Delete session error:', error));
    }

    // Global functions for integration
    window.sidebarFunctions = {
        loadChatSessions,
        createNewSession,
        switchToSession,
        deleteSession,
        toggleSidebar,
        toggleMobileSidebar,
        closeMobileSidebar
    };
</script>
