{% load static %}
<style>
    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: 250px;
        height: 100vh;
        background: white;
        border-right: 1px solid #e5e7eb;
        padding: 24px 0 0 0;
        z-index: 1000;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
    }
    .sidebar.collapsed {
        width: 80px;
    }
    .sidebar-logo {
        padding: 0 24px 32px 16px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        height: 80px;
        gap: 10px;
    }
    .sidebar-logo img {
        height: 40px;
        width: auto;
        display: block;
        margin: 0;
    }
    .sidebar-logo span {
        font-size: 20px;
        font-weight: 700;
        color: #1f2937;
        margin-left: 0;
        transition: opacity 0.3s;
    }
    .sidebar.collapsed .sidebar-logo span,
    .sidebar.collapsed .sidebar-link span {
        display: none;
    }
    .sidebar-nav {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
    }
    .sidebar-link {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 24px;
        color: #6b7280;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.2s ease;
        position: relative;
    }
    .sidebar-link:hover, .sidebar-link.active {
        background: #f3f4f6;
        color: #4285f4;
    }
    .sidebar-link.active::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: #4285f4;
    }
    .sidebar-link i {
        font-size: 20px;
        min-width: 20px;
    }
    .sidebar-logout {
        width: 100%;
        display: flex;
        justify-content: flex-start;
        margin-top: 0;
        margin-bottom: 30px;
    }
    @media (max-width: 768px) {
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            transform: translateX(-100%);
            z-index: 2000;
        }
        .sidebar.active {
            transform: translateX(0);
        }
    }
</style>

<div class="sidebar" id="sidebar">
    <a href="{% url 'mindmate:home' %}" style="text-decoration: none;">
        <div class="sidebar-logo">
            <img src="{% static 'logo.png' %}" alt="MindMate">
            <span>MindMate</span>
        </div>
    </a>
    <nav class="sidebar-nav">
        <a href="{% url 'mindmate:dashboard' %}" class="sidebar-link{% if request.resolver_match.url_name == 'dashboard' %} active{% endif %}">
            <i class="fas fa-th-large"></i>
            <span>Dashboard</span>
        </a>
        <a href="{% url 'mindmate:study_agent_chat' %}" class="sidebar-link{% if request.resolver_match.url_name == 'study_agent_chat' %} active{% endif %}">
            <i class="fas fa-robot"></i>
            <span>Study Agent</span>
        </a>
        <a href="{% url 'mindmate:calendar' %}" class="sidebar-link{% if request.resolver_match.url_name == 'calendar' %} active{% endif %}">
            <i class="fas fa-calendar-alt"></i>
            <span>Calendar</span>
        </a>
    </nav>
    <div class="sidebar-logout">
        <a href="{% url 'mindmate:logout' %}" class="sidebar-link" style="color: #e53e3e;">
            <i class="fas fa-sign-out-alt"></i>
            <span>Одјави се</span>
        </a>
    </div>
</div>
<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('collapsed');
    }
</script>
